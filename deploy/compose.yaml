# The whole service, locally.
#
#     docker compose -f deploy/compose.yaml up --build
#
# Four containers: PostgreSQL, an S3-compatible store, the API and one worker.
# That is the whole architecture, and running it on one machine is what makes
# the integration tests something a person can take before pushing rather than
# something they read about in a workflow file.
#
# The credentials here are the ones in `service/tests/conftest.py`, and they are
# in the file on purpose: this stack is for a laptop and a continuous
# integration runner, and a password nobody has to look up is one nobody puts
# in a shell history. Nothing here is the deployment.
#
# To run the suite against only the two dependencies, without building the two
# images:
#
#     docker compose -f deploy/compose.yaml up -d postgres storage

name: orrery

# Two networks, and the difference between them is the point.
#
# `internal` has no route off the machine. The worker is on it and on nothing
# else, so a process that runs a program over a document a stranger sent cannot
# reach anything but the database and the object store: not the internet, not a
# metadata service, not another container's port. That is the cheapest security
# property in this file and the one worth having most.
#
# PostgreSQL and the store are on both, only so that their ports can be
# published to the laptop the tests run on. `production.yaml` takes that away.
networks:
  edge:
  internal:
    internal: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orrery
      POSTGRES_PASSWORD: orrery
      POSTGRES_DB: orrery
    networks: [edge, internal]
    ports:
      - "5432:5432"
    healthcheck:
      # The API and the worker apply the schema themselves and would come up
      # against a PostgreSQL that is still starting, fail, and be restarted. A
      # readiness check is cheaper than a restart loop.
      test: ["CMD-SHELL", "pg_isready -U orrery -d orrery"]
      interval: 2s
      timeout: 3s
      retries: 15

  storage:
    image: minio/minio:latest
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: orrery
      MINIO_ROOT_PASSWORD: orrery123
    networks: [edge, internal]
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      ORRERY_DATABASE_URL: postgresql://orrery:orrery@postgres:5432/orrery
      ORRERY_STORAGE_ENDPOINT: http://storage:9000
      ORRERY_STORAGE_BUCKET: orrery
      ORRERY_STORAGE_ACCESS_KEY: orrery
      ORRERY_STORAGE_SECRET_KEY: orrery123
      # Where the client is served from while it is being worked on. The
      # deployed site's origin is added wherever this is actually deployed.
      ORRERY_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # A salt nobody has to look up, for the same reason the passwords above
      # are here. A deployment sets its own and keeps it.
      ORRERY_ADDRESS_SALT: local
    networks: [edge, internal]
    ports:
      - "8000:8000"
    # What a process that answers HTTP over a document a stranger sent should be
    # allowed to do, which is very little. No new privileges, no capabilities at
    # all, and a root filesystem it cannot write to: nothing here writes a file,
    # so the one writable place is the temporary directory Python expects.
    read_only: true
    tmpfs:
      # The mode is stated rather than left to the default, because a read-only
      # container whose one writable directory is not writable by the user it
      # runs as is a container that starts and then fails on its first request.
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      ORRERY_DATABASE_URL: postgresql://orrery:orrery@postgres:5432/orrery
      ORRERY_STORAGE_ENDPOINT: http://storage:9000
      ORRERY_STORAGE_BUCKET: orrery
      ORRERY_STORAGE_ACCESS_KEY: orrery
      ORRERY_STORAGE_SECRET_KEY: orrery123
      # Where the run's working directory goes. Python's tempfile reads this,
      # so a volume mounted here is what lets the root filesystem stay read
      # only. A volume rather than a tmpfs because a trajectory is tens of
      # megabytes and putting it in memory would count against the limit below.
      TMPDIR: /work
    # No `edge`. The worker talks to the database and the store and to nothing
    # else, and the way to be sure of that is not to give it a route.
    networks: [internal]
    volumes:
      - work:/work
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # What the simulator gets, and the ceiling that makes the published figures
    # honest: the GPU numbers in docs/performance.md were measured on a laptop,
    # and a run submitted here is two cores and two gigabytes.
    mem_limit: 2g
    cpus: 2.0
    # One. The queue is written so that several would be correct, and running
    # several here would hide the case this deployment actually has.
    deploy:
      replicas: 1

volumes:
  work:
