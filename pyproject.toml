# Packaging for the Python bindings.
#
# This file sits at the root rather than beside the bindings because pip builds
# a package from the directory holding pyproject.toml, and what has to be built
# here is the whole C++ project: the extension links every layer of it. A
# pyproject.toml under python/ would describe a package whose sources were all
# above it, which is a thing sdists cannot express.
#
# scikit-build-core is the build backend, so `pip install .` runs CMake with the
# settings below and packages what it installs. Nothing about the C++ build is
# duplicated here; the four definitions are the ones a wheel needs to differ on.

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
# The distribution is named orrery-nbody and the module it installs is named
# orrery, which is the one place in this project where a name is not the same on
# both sides of a boundary. `orrery` on PyPI belongs to an unrelated package
# that has been there since long before this one, and taking a second name is
# the only remedy: an import name can be shared across indexes, a distribution
# name cannot. So `pip install orrery-nbody` and then `import orrery`.
name = "orrery-nbody"
dynamic = ["version"]
description = "A GPU-accelerated N-body gravitational simulator"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENCE" }
keywords = ["n-body", "gravity", "simulation", "astrophysics", "barnes-hut"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]

# NumPy is a hard requirement rather than an extra. The arrays this package
# hands out are NumPy arrays, so a build of it without NumPy is not a smaller
# installation but a broken one.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# What the example notebooks need beyond the package itself. They are an extra
# rather than a dependency because a program using the bindings needs none of
# it, and jupyter is a large thing to install for somebody who wanted a solver.
notebooks = ["jupyter>=1.0", "matplotlib>=3.6"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Protonicwave/orrery"
Documentation = "https://github.com/Protonicwave/orrery/blob/main/docs/python.md"
Source = "https://github.com/Protonicwave/orrery"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.25"
build-dir = "build/wheel/{wheel_tag}"

# The package sources come from the source tree and the extension from the
# install step, and they meet inside the wheel's orrery directory. That is the
# same arrangement python/CMakeLists.txt produces in a build tree, by a
# different route, because it is the only one the package's own import can read.
wheel.packages = ["python/orrery"]
install.components = ["orrery_python"]

[tool.scikit-build.cmake.define]
ORRERY_BUILD_PYTHON = "ON"

# The test suite and the measurement programs are not part of a wheel, and
# building them would make an installation fetch Catch2 and compile several
# hundred cases nobody is going to run.
ORRERY_BUILD_TESTS = "OFF"
ORRERY_BUILD_BENCHMARKS = "OFF"

# A wheel may be built by a compiler this project has never been tested with,
# on a machine whose owner wants a working install rather than a report on our
# warning set. Continuous integration is where warnings are errors; here they
# are warnings.
ORRERY_WARNINGS_AS_ERRORS = "OFF"

# One statement of the version, in the CMakeLists.txt that the C++ library also
# reports through core::version(). Two would eventually differ, and the one a
# result was filed against would depend on which half of the project reported
# it.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '(?sm)project\s*\([^)]*VERSION\s+(?P<value>[0-9]+(\.[0-9]+)*)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]

# How the released wheels are built. This lives here rather than in the release
# workflow so that the build is the same whether continuous integration runs it
# or somebody runs cibuildwheel by hand, which is the only way to reproduce a
# release without a GitHub account.
[tool.cibuildwheel]
build-frontend = "build"

# PyPy is skipped because pybind11 supports it but this project has never been
# built or tested against it, and a wheel nobody has run is worse than no wheel.
# musllinux is skipped for the same reason. The 32-bit targets are skipped
# because a simulator whose point is millions of particles has no use for a
# 4 GB address space.
skip = ["pp*", "*-musllinux*", "*_i686", "*-win32"]

# glibc 2.28, which is what the C++20 the project is written in needs. The
# default manylinux image ships GCC 10, which does not have a complete <format>
# or the ranges the code uses; 2_28 ships GCC 14.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# The wheel's own test suite, run against the installed wheel on the machine
# that built it. This is what makes a green release job evidence rather than a
# claim: no runner has an Intel GPU or the oneAPI compiler, so a wheel that
# imports and passes here is a wheel that does not need either. The SYCL backend
# is off by default (ORRERY_ENABLE_SYCL) and this is the check that it stays
# genuinely optional.
test-requires = "pytest"
test-command = "pytest {project}/python/tests"

[tool.cibuildwheel.macos.environment]
# std::filesystem and the rest of the C++ standard library this project uses
# arrived in the macOS 10.15 runtime. Anything older would link and then fail to
# load, which is the worst of the three possible outcomes.
MACOSX_DEPLOYMENT_TARGET = "10.15"
