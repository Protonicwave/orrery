name: Proposal
description: Suggest a capability, an algorithm, or a change of approach
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Orrery is a gravitational N-body simulator with a fixed scope. General
        relativity, hydrodynamics, collisional dynamics with regularisation and
        distributed multi-node execution are all deliberately out of scope, as
        is turning the project into a general physics framework. Proposals in
        those directions will be closed with thanks rather than acted on.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is difficult, slow, inaccurate or impossible today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you would like the project to do instead.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other ways of solving the same problem, and why this one is preferable.
    validations:
      required: false

  - type: dropdown
    id: phase
    attributes:
      label: Related phase
      description: >
        The phase in docs/IMPLEMENTATION_PLAN.md this touches, if any.
      options:
        - Not sure
        - Repository, build system or CI
        - Core data structures
        - Diagnostics and initial conditions
        - Integrators
        - Direct solver
        - CPU threading
        - Vectorisation and benchmarking
        - Barnes-Hut
        - SYCL backend
        - Driver, configuration and I/O
        - Visualisation
        - Python bindings
        - Documentation and release
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: >
        Measurements, references or papers that support the proposal. A
        performance proposal without a measurement is a guess.
    validations:
      required: false
