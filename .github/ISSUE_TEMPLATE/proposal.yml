name: Proposal
description: Suggest a capability, an algorithm, or a change of approach
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Orrery is a gravitational N-body simulator with a fixed scope. General
        relativity, hydrodynamics, collisional dynamics with regularisation and
        distributed multi-node execution are all deliberately out of scope, as
        is turning the project into a general physics framework. Proposals in
        those directions will be closed with thanks rather than acted on.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is difficult, slow, inaccurate or impossible today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you would like the project to do instead.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other ways of solving the same problem, and why this one is preferable.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of the project
      description: >
        The layer this touches. The layering is described in CONTRIBUTING.md.
      options:
        - Not sure
        - core, particle storage and vector maths
        - initial_conditions, sampled models and analytic configurations
        - backend, CPU threading and the SYCL device
        - integrators
        - solvers, direct and Barnes-Hut
        - sim, the run and the file formats
        - viz, the camera, the tone mapping and the renderer
        - apps, the command line
        - python, the bindings and the package
        - Build system, continuous integration or documentation
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: >
        Measurements, references or papers that support the proposal. A
        performance proposal without a measurement is a guess.
    validations:
      required: false
