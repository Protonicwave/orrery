# The published site: built on every pull request, published from main.
#
# Two things are published from one deployment, because GitHub Pages allows a
# repository one: the documentation at the root, and the browser client under
# /instrument/. A second workflow deploying separately would not sit beside
# this one, it would replace whatever it found. ADR-0045.
#
# A workflow of its own rather than a job in ci.yml, because publishing needs
# `pages: write` and `id-token: write`, and the checks that decide whether a
# change is correct have no business holding permissions that can rewrite a
# published site.
#
# The build half is a check like any other. Doxygen is configured to fail on a
# warning (docs/Doxyfile), so a link that has gone dead or a reference that no
# longer resolves fails a pull request here rather than appearing on the site,
# and the client's size budget fails a pull request in the same way.
#
# Actions are pinned to a commit rather than a tag, for the same reason the C++
# dependencies are: a tag can be moved onto different code without anything in
# this repository changing. ADR-0002.

name: Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned by version and checked by hash, so that the site a pull request
  # builds is the site main publishes. The version matters here rather than
  # being a formality: the Doxyfile uses GitHub-style heading anchors, which
  # arrived in 1.10, and the version Ubuntu packages is older than that.
  DOXYGEN_VERSION: "1.17.0"
  DOXYGEN_SHA256: "75419ef4f446fc1c24ef12514b574e66e898ee6f527c6ae2ad84f91a905823c2"

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Doxygen
        run: |
          set -o errexit
          archive="doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl --silent --show-error --location --output "${archive}" \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/${archive}"
          echo "${DOXYGEN_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --file "${archive}"
          echo "${PWD}/doxygen-${DOXYGEN_VERSION}/bin" >> "${GITHUB_PATH}"

      # From the repository root, which is what every path in the Doxyfile
      # assumes and what a reader running it by hand will be sitting in.
      - name: Build the documentation
        run: |
          set -o errexit
          doxygen --version
          doxygen docs/Doxyfile

      # The gallery is a run of the simulator, not a file in the repository.
      # Trajectories are large and reproducible from a configuration and a seed,
      # so they are generated here from examples/ by the code being published
      # beside them. The cache key covers everything that decides what comes
      # out: the solver, the initial conditions, the configurations and the
      # definition of what is published. A change to any of them runs it again.
      - name: Restore the published gallery
        id: gallery
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: web/public/gallery
          key: >-
            gallery-${{ hashFiles('src/**', 'include/**', 'apps/**',
            'examples/*.orrery', 'web/src/gallery/runs.ts',
            'web/tools/publish_gallery.ts') }}

      - name: Install Ninja
        if: steps.gallery.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      # Single precision, which is what every published run is written in and
      # what the publishing tool checks the binary for. See web/src/gallery.
      - name: Build the simulator
        if: steps.gallery.outputs.cache-hit != 'true'
        env:
          CXX: clang++
        run: |
          set -o errexit
          cmake --preset single-precision -DORRERY_BUILD_TESTS=OFF \
            -DORRERY_BUILD_BENCHMARKS=OFF
          cmake --build --preset single-precision --target orrery

      # Pinned to a version rather than a range, and to a long-term support
      # release that runs TypeScript directly, which is what the client's own
      # tools are written in.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` rather than `npm install`, so the build uses the versions the
      # lock file names and a published site cannot pick up a release that was
      # made after the pull request was reviewed.
      - name: Install the client's dependencies
        working-directory: web
        run: npm ci

      # After the dependencies, because the tool is TypeScript that imports the
      # gallery's definition, and before the build, because Vite copies what is
      # in public/ into the site.
      - name: Publish the gallery
        if: steps.gallery.outputs.cache-hit != 'true'
        working-directory: web
        run: npm run gallery -- ../build/single-precision/apps/orrery

      - name: Build the client
        working-directory: web
        run: npm run build

      # The budget is asserted here rather than reported, so a change that
      # doubles the download fails the pull request that makes it.
      - name: Assert the size budget
        working-directory: web
        run: npm run budget

      - name: Assemble the site
        run: |
          set -o errexit
          mkdir --parents site/instrument
          cp --recursive build/html/. site/
          cp --recursive web/dist/. site/instrument/

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # One deployment at a time, and a deployment in flight is allowed to finish.
    # Cancelling it would leave the site as whatever half of it had been served,
    # which is the one state worse than being briefly out of date.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
