# Continuous integration. Every job here is one line of the definition of done
# in CONTRIBUTING.md, so a green run is the evidence that a pull request meets
# it rather than a claim that it does.
#
# Actions are pinned to a commit rather than a tag, for the same reason the C++
# dependencies are: a tag can be moved onto different code without anything in
# this repository changing. ADR-0002.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A later push to a branch makes the earlier run's answer obsolete, so the
# earlier run is cancelled rather than left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The LLVM release used for lint and for the sanitiser run. It is pinned so
  # that a runner image update cannot introduce diagnostics the project has not
  # seen, and it matches the clang-format version below.
  LLVM_VERSION: "22"
  CLANG_FORMAT_VERSION: "22.1.8"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One compiler failing says nothing about the others, and the whole point
      # of the matrix is to learn about all of them in one run.
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC debug
            os: ubuntu-24.04
            preset: debug
            cc: gcc
            cxx: g++
          - name: Linux GCC release
            os: ubuntu-24.04
            preset: release
            cc: gcc
            cxx: g++
          - name: Linux Clang debug
            os: ubuntu-24.04
            preset: debug
            cc: clang
            cxx: clang++
          - name: Linux Clang release
            os: ubuntu-24.04
            preset: release
            cc: clang
            cxx: clang++
          - name: Linux Clang single precision
            os: ubuntu-24.04
            preset: single-precision
            cc: clang
            cxx: clang++
          - name: macOS Clang release
            os: macos-latest
            preset: release
            cc: clang
            cxx: clang++
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  build-windows:
    name: Windows MSVC ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Windows gets a job of its own rather than a row in the matrix above
      # because MSVC is reached through a batch script whose environment does
      # not survive the end of a step, so configure, build and test have to
      # share one. The Visual Studio version is discovered with vswhere rather
      # than named, since the runner image's version changes without notice and
      # a version named here would be wrong soon afterwards.
      - name: Configure, build and test
        shell: cmd
        run: |
          set VSWHERE="C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`%VSWHERE% -latest -products * -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo No Visual Studio installation was found. & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset ${{ matrix.preset }} || exit /b 1
          cmake --build --preset ${{ matrix.preset }} || exit /b 1
          ctest --preset ${{ matrix.preset }} || exit /b 1

  sycl:
    name: SYCL compile and no-device fallback
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the oneAPI DPC++ compiler and Ninja
        run: |
          set -o errexit
          wget --quiet --output-document=- \
            https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install --yes intel-oneapi-compiler-dpcpp-cpp ninja-build

      # This job cannot measure the GPU and does not try. No hosted runner has
      # an Intel Arc part, so what is being checked is the half of Phase 9 that
      # a machine without a device can still check, and that half is not small:
      # that the SYCL sources compile, that the device code passes the device
      # compiler, and that discovery reports no device rather than throwing.
      #
      # The last of those is the one worth having in CI. Graceful fallback is
      # asserted by tests that skip their GPU cases and require the discovery
      # layer to answer, so a change that made a missing device an error would
      # fail here rather than on somebody's laptop.
      #
      # Configure, build and test share a step because setvars.sh sets the
      # environment in the shell that sources it and that does not survive the
      # end of a step, which is the same reason the Windows job above is one
      # step.
      - name: Configure, build and test
        run: |
          set -o errexit
          source /opt/intel/oneapi/setvars.sh
          cmake --preset sycl -DCMAKE_CXX_COMPILER=icpx
          cmake --build --preset sycl
          ctest --preset sycl

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        # git ls-files rather than a find, so that a source file which is not
        # tracked is not quietly exempt from the project's formatting.
        run: |
          set -o errexit
          files=$(git ls-files '*.cpp' '*.hpp' '*.ipp')
          if [ -z "${files}" ]; then
            echo "No C++ sources were found. The pattern above is wrong."
            exit 1
          fi
          echo "${files}"
          clang-format --version
          clang-format --dry-run --Werror ${files}

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install LLVM and Ninja
        run: |
          set -o errexit
          wget --quiet --output-document=llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"
          sudo apt-get install --yes "clang-tidy-${LLVM_VERSION}" ninja-build

      - name: Configure
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
        run: >
          cmake --preset lint
          -DORRERY_CLANG_TIDY_EXECUTABLE=clang-tidy-${{ env.LLVM_VERSION }}

      # clang-tidy runs as part of compilation, so building the lint preset is
      # the check. A diagnostic is an error by the WarningsAsErrors setting in
      # .clang-tidy.
      - name: Lint
        run: cmake --build --preset lint

  sanitise:
    name: Sanitisers ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      # Address and undefined cannot be combined with thread, so the two builds
      # are separate rows rather than one preset with everything switched on.
      # The thread sanitiser matters from Phase 6 onwards, which is where the
      # project acquired a scheduler for it to have an opinion about.
      fail-fast: false
      matrix:
        preset: [sanitise, thread-sanitise]
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install LLVM and Ninja
        run: |
          set -o errexit
          wget --quiet --output-document=llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"
          sudo apt-get install --yes ninja-build

      - name: Configure
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
