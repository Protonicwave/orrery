# Continuous integration. Every job here is one line of the definition of done
# in CONTRIBUTING.md, so a green run is the evidence that a pull request meets
# it rather than a claim that it does.
#
# Actions are pinned to a commit rather than a tag, for the same reason the C++
# dependencies are: a tag can be moved onto different code without anything in
# this repository changing. ADR-0002.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A later push to a branch makes the earlier run's answer obsolete, so the
# earlier run is cancelled rather than left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The LLVM release used for lint and for the sanitiser run. It is pinned so
  # that a runner image update cannot introduce diagnostics the project has not
  # seen, and it matches the clang-format version below.
  LLVM_VERSION: "22"
  CLANG_FORMAT_VERSION: "22.1.8"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One compiler failing says nothing about the others, and the whole point
      # of the matrix is to learn about all of them in one run.
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC debug
            os: ubuntu-24.04
            preset: debug
            cc: gcc
            cxx: g++
          - name: Linux GCC release
            os: ubuntu-24.04
            preset: release
            cc: gcc
            cxx: g++
          - name: Linux Clang debug
            os: ubuntu-24.04
            preset: debug
            cc: clang
            cxx: clang++
          - name: Linux Clang release
            os: ubuntu-24.04
            preset: release
            cc: clang
            cxx: clang++
          - name: Linux Clang single precision
            os: ubuntu-24.04
            preset: single-precision
            cc: clang
            cxx: clang++
          - name: macOS Clang release
            os: macos-latest
            preset: release
            cc: clang
            cxx: clang++
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  build-windows:
    name: Windows MSVC ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Windows gets a job of its own rather than a row in the matrix above
      # because MSVC is reached through a batch script whose environment does
      # not survive the end of a step, so configure, build and test have to
      # share one. The Visual Studio version is discovered with vswhere rather
      # than named, since the runner image's version changes without notice and
      # a version named here would be wrong soon afterwards.
      - name: Configure, build and test
        shell: cmd
        run: |
          set VSWHERE="C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`%VSWHERE% -latest -products * -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo No Visual Studio installation was found. & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --preset ${{ matrix.preset }} || exit /b 1
          cmake --build --preset ${{ matrix.preset }} || exit /b 1
          ctest --preset ${{ matrix.preset }} || exit /b 1

  sycl:
    name: SYCL compile and no-device fallback
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the oneAPI DPC++ compiler and Ninja
        run: |
          set -o errexit
          wget --quiet --output-document=- \
            https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install --yes intel-oneapi-compiler-dpcpp-cpp ninja-build

      # This job cannot measure the GPU and does not try. No hosted runner has
      # an Intel Arc part, so what is being checked is the half of Phase 9 that
      # a machine without a device can still check, and that half is not small:
      # that the SYCL sources compile, that the device code passes the device
      # compiler, and that discovery reports no device rather than throwing.
      #
      # The last of those is the one worth having in CI. Graceful fallback is
      # asserted by tests that skip their GPU cases and require the discovery
      # layer to answer, so a change that made a missing device an error would
      # fail here rather than on somebody's laptop.
      #
      # Configure, build and test share a step because setvars.sh sets the
      # environment in the shell that sources it and that does not survive the
      # end of a step, which is the same reason the Windows job above is one
      # step.
      - name: Configure, build and test
        run: |
          set -o errexit
          source /opt/intel/oneapi/setvars.sh
          cmake --preset sycl -DCMAKE_CXX_COMPILER=icpx
          cmake --build --preset sycl
          ctest --preset sycl

  renderer:
    name: Renderer compile
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # GLFW builds against the window system's development headers, which a
      # server image does not carry. Both sets are installed, because GLFW 3.4
      # on Linux enables X11 and Wayland together by default and stops at
      # configure time if either is missing: wayland-scanner is a build tool
      # rather than a library and lives in its own package, which is the piece
      # that is easy to leave out.
      #
      # The alternative is to switch Wayland off and build the X11 backend
      # alone. It is not taken because most Linux desktops now run Wayland, so a
      # job that checked only the X11 backend would be checking the display
      # server fewer of this project's users have.
      #
      # mesa-common-dev is separate from all of that and is needed by this
      # project rather than by GLFW: GLFW's own header includes GL/gl.h, and a
      # server image carries no OpenGL headers at all. It is the declarations
      # that are wanted here and not a driver, which is the whole reason a job
      # with no GPU can compile a renderer.
      - name: Install the window system headers and Ninja
        run: |
          set -o errexit
          sudo apt-get update
          sudo apt-get install --yes ninja-build libxinerama-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev \
            libwayland-bin wayland-protocols mesa-common-dev

      # This job cannot open a window and does not try. No hosted runner has a
      # display or an OpenGL 3.3 driver, so what is checked is what a machine
      # without either can still check: that the renderer, the loader and the
      # viewer compile under the project's warning set, and that the test suite
      # passes in a configuration where they exist.
      #
      # The suite is worth running here rather than only building. Every case in
      # tests/viz runs without a device by construction, and this is the job that
      # proves that claim on a machine that has none.
      - name: Configure, build and test
        env:
          CC: clang
          CXX: clang++
        run: |
          set -o errexit
          cmake --preset renderer
          cmake --build --preset renderer
          ctest --preset renderer

  python:
    name: Python bindings ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # The bindings are built and tested on the three platforms the C++ library
      # is, because an extension module is where the differences between them
      # show up: the shared library it produces, the interpreter it has to link
      # against and the way a wheel is tagged all differ.
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Installed as a wheel rather than built with the preset, because what a
      # user of these bindings does is pip install, and that path exercises the
      # packaging configuration as well as the code. The preset is the developer
      # route and is covered by the pytest suite that ctest runs in the build
      # matrix above.
      #
      # No Ninja and no compiler is named. scikit-build-core picks the platform
      # default, which is one more compiler than the matrix above covers on
      # macOS and Windows and the same one on Linux.
      - name: Build and install the wheel
        run: python -m pip install --verbose ".[notebooks,test]"

      # From a directory that is not the repository root, so that the tests
      # import the installed package rather than the source tree beside them.
      # An import that only worked from the checkout is a package that does not
      # work.
      - name: Test the installed package
        run: |
          cd "${{ runner.temp }}"
          python -m pytest -q "${{ github.workspace }}/python/tests"

      # The definition of done for this phase is that the notebooks run from a
      # clean environment and reproduce the figures the test suite asserts. Every
      # claim in them is an assertion, so executing them is a check rather than a
      # rendering: a figure that stopped matching would fail here.
      #
      # Agg because a hosted runner has no display, and --stdout so that no
      # executed copy is written beside the committed one.
      - name: Execute the example notebooks
        env:
          MPLBACKEND: Agg
        run: |
          python -m jupyter nbconvert --to notebook --execute --stdout \
            python/notebooks/01_validation.ipynb > /dev/null
          python -m jupyter nbconvert --to notebook --execute --stdout \
            python/notebooks/02_solver_accuracy.ipynb > /dev/null
          python -m jupyter nbconvert --to notebook --execute --stdout \
            python/notebooks/03_galaxy_collision.ipynb > /dev/null
        shell: bash

  web:
    name: Browser client
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Pinned to a version rather than a range, and to a long-term support
      # release that runs TypeScript directly, which is what the client's own
      # tools are written in.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs exactly what the lock file names and fails if the two
      # disagree, which is the same pin-and-check the C++ dependencies get.
      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint and format
        working-directory: web
        run: npm run lint

      - name: Type check
        working-directory: web
        run: npm run typecheck

      # Before the unit suite, because two of its tests run the module and
      # compare what it computes against a trajectory the native build wrote:
      # one for the module itself and one for a design out of the editor. Both
      # skip themselves when the module is absent, so without this the
      # comparisons those builds exist to pass would quietly not be made.
      - name: Build the WebAssembly module
        uses: ./.github/actions/solver

      - name: Test
        working-directory: web
        run: npm test

      # The instrument draws a run, so the browser tests need one to draw. The
      # gallery is generated rather than committed, by the same action the site
      # workflow uses, and it has to be in public/ before the build because
      # that is when Vite copies it. Without this the client comes up saying it
      # has no run, which is a state worth having but not the one under test.
      - name: Publish the gallery
        uses: ./.github/actions/gallery

      # The browser tests run against the production build, because what they
      # check, the fonts arriving, nothing being fetched from another origin,
      # the layout not moving and the audit finding nothing, are properties of
      # what is published rather than of the development server.
      - name: Build
        working-directory: web
        run: npm run build

      - name: Install the browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test in a browser
        working-directory: web
        run: npm run e2e

  service:
    name: Compute service
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the service
        run: python -m pip install -e "service[test,dev]"

      - name: Lint and format
        working-directory: service
        run: |
          set -o errexit
          ruff check .
          ruff format --check .

      # The Pydantic models are the only statement of the contract, and
      # web/src/service/contract.ts is generated from them. Regenerating it here
      # and requiring the working tree to be unchanged is what stops the two
      # halves of the boundary describing different things: a field added on one
      # side and not the other fails here rather than reaching a client that does
      # not know about it.
      - name: Check the generated contract is current
        run: |
          set -o errexit
          python service/tools/export_contract.py
          git diff --exit-code -- web/src/service/contract.ts

      # The simulator, which the worker runs and which the configuration reader
      # is compared against. Only the one target: the suite and the benchmarks
      # are built and run by the matrix above, and building them again here would
      # add several minutes to a job that needs one binary.
      - name: Build the simulator
        run: |
          set -o errexit
          sudo apt-get update && sudo apt-get install --yes ninja-build
          cmake --preset release -DORRERY_BUILD_TESTS=OFF -DORRERY_BUILD_BENCHMARKS=OFF
          cmake --build --preset release --target orrery

      # The same command service/README.md gives a developer, so that what runs
      # here is what somebody can run before pushing rather than a second
      # arrangement that only exists in this file. --wait holds until both
      # containers report healthy.
      - name: Start PostgreSQL and the object store
        run: docker compose -f deploy/compose.yaml up -d --wait postgres storage

      # Everything, integration cases included. Those skip themselves without a
      # database, an object store and a binary, and this job exists to be the
      # place that has all three: the queue's concurrency, a worker killed part
      # way through a run, and the agreement between this project's two readers
      # of the configuration format are none of them checkable without them.
      - name: Test
        working-directory: service
        env:
          ORRERY_TEST_DATABASE_URL: postgresql://orrery:orrery@localhost:5432/orrery
          ORRERY_TEST_STORAGE_ENDPOINT: http://localhost:9000
          ORRERY_BINARY: ${{ github.workspace }}/build/release/apps/orrery
        run: python -m pytest -q

      - name: Stop the containers
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes

      # The deployment overlay is never brought up here, so what can be checked
      # is that it is a stack at all: that it renders, and that the property it
      # exists for survived the merge. The worker being on the internal network
      # and on nothing else is the one that would fail silently, since a stack
      # with a worker that can reach the internet comes up perfectly well.
      - name: Check the deployment stack renders
        env:
          ORRERY_POSTGRES_USER: orrery
          ORRERY_POSTGRES_PASSWORD: not-a-real-password
          ORRERY_POSTGRES_DB: orrery
          ORRERY_DATABASE_URL: postgresql://orrery:not-a-real-password@postgres:5432/orrery
          ORRERY_STORAGE_ACCESS_KEY: orrery
          ORRERY_STORAGE_SECRET_KEY: not-a-real-password
          ORRERY_ALLOWED_ORIGINS: https://example.invalid
          ORRERY_ADDRESS_SALT: not-a-real-salt
        run: |
          set -o errexit
          docker compose -f deploy/compose.yaml config > /dev/null
          docker compose -f deploy/compose.yaml -f deploy/production.yaml \
            config --format json > "$RUNNER_TEMP/stack.json"

          test "$(jq -r '.services.worker.networks | keys | join(",")' "$RUNNER_TEMP/stack.json")" = internal
          test "$(jq -r '.services.postgres.ports // [] | length' "$RUNNER_TEMP/stack.json")" = 0
          test "$(jq -r '.services.storage.ports // [] | length' "$RUNNER_TEMP/stack.json")" = 0
          test "$(jq -r '.services.api.ports[0].host_ip' "$RUNNER_TEMP/stack.json")" = 127.0.0.1

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install clang-format
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Check formatting
        # git ls-files rather than a find, so that a source file which is not
        # tracked is not quietly exempt from the project's formatting.
        run: |
          set -o errexit
          files=$(git ls-files '*.cpp' '*.hpp' '*.ipp')
          if [ -z "${files}" ]; then
            echo "No C++ sources were found. The pattern above is wrong."
            exit 1
          fi
          echo "${files}"
          clang-format --version
          clang-format --dry-run --Werror ${files}

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install LLVM and Ninja
        run: |
          set -o errexit
          wget --quiet --output-document=llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"
          sudo apt-get install --yes "clang-tidy-${LLVM_VERSION}" ninja-build

      - name: Configure
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
        run: >
          cmake --preset lint
          -DORRERY_CLANG_TIDY_EXECUTABLE=clang-tidy-${{ env.LLVM_VERSION }}

      # clang-tidy runs as part of compilation, so building the lint preset is
      # the check. A diagnostic is an error by the WarningsAsErrors setting in
      # .clang-tidy.
      - name: Lint
        run: cmake --build --preset lint

  sanitise:
    name: Sanitisers ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      # Address and undefined cannot be combined with thread, so the two builds
      # are separate rows rather than one preset with everything switched on.
      # The thread sanitiser matters from Phase 6 onwards, which is where the
      # project acquired a scheduler for it to have an opinion about.
      fail-fast: false
      matrix:
        preset: [sanitise, thread-sanitise]
    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install LLVM and Ninja
        run: |
          set -o errexit
          wget --quiet --output-document=llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"
          sudo apt-get install --yes ninja-build

      - name: Configure
        env:
          CC: clang-${{ env.LLVM_VERSION }}
          CXX: clang++-${{ env.LLVM_VERSION }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
