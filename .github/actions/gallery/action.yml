# The published gallery, produced once and defined once.
#
# The gallery is a run of the simulator, not a file in the repository.
# Trajectories are large and reproducible from a configuration and a seed, which
# is the rule .gitignore already states for *.otj, so they are generated by the
# code being published beside them.
#
# Two jobs need them and neither can borrow the other's: the site workflow
# builds what is published, and the browser tests in ci.yml drive a client that
# draws nothing without a run to draw. This action is what they share, so a
# change to how a run is produced cannot reach one of them and not the other.
#
# Preconditions: the repository is checked out, Node is set up, and `npm ci` has
# run in web/. The publishing tool is TypeScript that imports the gallery's own
# definition, so it needs the client's dependencies; and Vite copies public/
# into the build, so this has to finish before the client is built.

name: Publish the gallery
description: Run the simulator over the configurations web/src/gallery/runs.ts names.

runs:
  using: composite
  steps:
    # The cache key covers everything that decides what comes out: the solver,
    # the initial conditions, the configurations and the definition of what is
    # published. A change to any of them runs the simulator again.
    #
    # The two workflows share the key deliberately, so that the second of them
    # to run restores what the first produced. When both miss and both run at
    # once, both also try to save it, and the loser of that race logs that the
    # entry already exists and carries on. That is the intended behaviour and
    # not a failure: the entry it could not write is the one it would have
    # written.
    - name: Restore the published gallery
      id: cached
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: web/public/gallery
        key: >-
          gallery-${{ hashFiles('src/**', 'include/**', 'apps/**',
          'examples/*.orrery', 'web/src/gallery/runs.ts',
          'web/tools/publish_gallery.ts') }}

    - name: Install Ninja
      if: steps.cached.outputs.cache-hit != 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes ninja-build

    # Single precision, which is what every published run is written in and what
    # the publishing tool checks the binary for. See web/src/gallery/runs.ts.
    - name: Build the simulator
      if: steps.cached.outputs.cache-hit != 'true'
      shell: bash
      env:
        CXX: clang++
      run: |
        set -o errexit
        cmake --preset single-precision -DORRERY_BUILD_TESTS=OFF \
          -DORRERY_BUILD_BENCHMARKS=OFF
        cmake --build --preset single-precision --target orrery

    - name: Publish the gallery
      if: steps.cached.outputs.cache-hit != 'true'
      shell: bash
      working-directory: web
      run: npm run gallery -- ../build/single-precision/apps/orrery
