<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orrery</title>
    <meta
      name="description"
      content="An N-body gravitational simulator in C++20, and the instrument that reads its runs."
    />

    <!--
      The four faces the shell paints with, fetched in parallel with the module
      rather than after the stylesheet that asks for them. Each is a few
      kilobytes because tools/subset_fonts.py cuts them to the characters this
      design sets, which is what makes preloading all four affordable and what
      keeps the layout from shifting when they land.
    -->
    <link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-sans-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
