<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="system-ui, sans-serif">
  <title>Orrery direct solver against measured limits, 8192 particles, double</title>
  <text x="90" y="28" text-anchor="start" font-size="16" fill="#8a8a8a">Orrery direct solver against measured limits, 8192 particles, double</text>
  <rect x="90" y="50" width="780" height="450" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="90" y1="50" x2="90" y2="500" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="90" y="520" text-anchor="middle" font-size="12" fill="#8a8a8a">0.10</text>
  <line x1="220" y1="50" x2="220" y2="500" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="220" y="520" text-anchor="middle" font-size="12" fill="#8a8a8a">1.00</text>
  <line x1="350" y1="50" x2="350" y2="500" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="350" y="520" text-anchor="middle" font-size="12" fill="#8a8a8a">10.0</text>
  <line x1="480" y1="50" x2="480" y2="500" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="480" y="520" text-anchor="middle" font-size="12" fill="#8a8a8a">100.0</text>
  <line x1="610" y1="50" x2="610" y2="500" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="610" y="520" text-anchor="middle" font-size="12" fill="#8a8a8a">1.00k</text>
  <line x1="740" y1="50" x2="740" y2="500" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="740" y="520" text-anchor="middle" font-size="12" fill="#8a8a8a">10.0k</text>
  <line x1="870" y1="50" x2="870" y2="500" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="870" y="520" text-anchor="middle" font-size="12" fill="#8a8a8a">100.0k</text>
  <line x1="90" y1="500" x2="870" y2="500" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="82" y="504" text-anchor="end" font-size="12" fill="#8a8a8a">10.0G</text>
  <line x1="90" y1="275" x2="870" y2="275" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="82" y="279" text-anchor="end" font-size="12" fill="#8a8a8a">100.0G</text>
  <line x1="90" y1="50" x2="870" y2="50" stroke="#8a8a8a" stroke-width="0.4" stroke-dasharray="3 4"/>
  <text x="82" y="54" text-anchor="end" font-size="12" fill="#8a8a8a">1.00T</text>
  <text x="480" y="545" text-anchor="middle" font-size="13" fill="#8a8a8a">arithmetic intensity, flop per byte read from memory</text>
  <text x="20" y="275" text-anchor="middle" font-size="13" fill="#8a8a8a" transform="rotate(-90 20 275)">attained flop per second</text>
  <polyline fill="none" stroke="#4c78a8" stroke-width="2" points="90,504.318 289.945,158.259 870,158.259"/>
  <text x="297.945" y="148.259" text-anchor="start" font-size="12" fill="#4c78a8">peak 330.3G flop/s, ridge at 3.45 flop/byte</text>
  <polyline fill="none" stroke="#4c78a8" stroke-width="1.6" stroke-dasharray="6 4" points="233.749,255.522 870,255.522"/>
  <text x="241.749" y="245.522" text-anchor="start" font-size="12" fill="#4c78a8">divide and square root limit for this mix, 122.1G flop/s</text>
  <line x1="702.198" y1="370.241" x2="702.198" y2="158.259" stroke="#e4572e" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="702.198" cy="370.241" r="5" fill="#e4572e"/>
  <text x="692.198" y="374.241" text-anchor="end" font-size="12" fill="#e4572e">scalar, all cores, 37.7G flop/s (11% of roof)</text>
  <line x1="702.198" y1="277.707" x2="702.198" y2="158.259" stroke="#e4572e" stroke-width="0.8" stroke-dasharray="2 3"/>
  <circle cx="702.198" cy="277.707" r="5" fill="#e4572e"/>
  <text x="692.198" y="281.707" text-anchor="end" font-size="12" fill="#e4572e">avx2, all cores, 97.3G flop/s (29% of roof)</text>
</svg>
